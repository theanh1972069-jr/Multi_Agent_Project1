services:
  postgres:
    image: postgres:16-alpine
    container_name: diabetes_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-diabetes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-diabetes}
      POSTGRES_DB: ${POSTGRES_DB:-diabetes_app}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-diabetes} -d ${POSTGRES_DB:-diabetes_app}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: python:3.13-slim
    container_name: diabetes_backend
    profiles: ["full", "backend"]
    working_dir: /app
    volumes:
      - ..:/app
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-diabetes}:${POSTGRES_PASSWORD:-diabetes}@postgres:5432/${POSTGRES_DB:-diabetes_app}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "pip install --no-cache-dir -r backend/requirements.txt &&
             uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    image: node:22-alpine
    container_name: diabetes_frontend
    profiles: ["full", "frontend"]
    working_dir: /app/frontend
    volumes:
      - ..:/app
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  postgres_data:
